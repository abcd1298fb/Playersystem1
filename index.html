<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>plyr</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .player-wrapper {
            position: relative;
            width: 100vw;
            height: 100svh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .player-wrapper.is-fullscreen {
            width: 100vw;
            height: 100dvh;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        /* =========================================================
           SEEK BUTTONS
        ========================================================= */

        .seek-overlay-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.62);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            padding: 15px 20px;
            border-radius: 50px;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.9;
            transition: background 0.2s, transform 0.2s, opacity 0.3s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .player-wrapper.hide-controls .seek-overlay-btn {
            opacity: 0;
            pointer-events: none;
        }

        .seek-overlay-btn:hover {
            background: rgba(229, 9, 20, 0.8);
            border-color: #E50914;
            transform: translateY(-50%) scale(1.05);
        }

        .seek-left {
            left: 8%;
        }

        .seek-right {
            right: 8%;
        }

        /* =========================================================
           MOBILE GESTURE INDICATOR
        ========================================================= */

        .gesture-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.75);
            min-width: 120px;
            padding: 18px 22px;
            background: rgba(0, 0, 0, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .gesture-indicator.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* =========================================================
           CENTER PLAY
        ========================================================= */

        .center-big-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 75px;
            height: 75px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 22;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .center-big-play-btn.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .center-big-play-btn svg {
            width: 36px;
            height: 36px;
            fill: #fff;
        }

        /* =========================================================
           PLAYER OVERLAY
        ========================================================= */

        .player-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 10, 0.90);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.35s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 25;
            text-align: center;
            padding: 20px;
        }

        .player-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .netflix-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #E50914;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .overlay-text {
            margin-top: 15px;
            font-size: 15px;
            color: #b3b3b3;
            font-weight: 500;
            max-width: 90%;
        }

        .overlay-subtext {
            margin-top: 8px;
            font-size: 12px;
            color: #777;
            max-width: 90%;
        }

        .overlay-retry-btn {
            margin-top: 18px;
            background: #E50914;
            color: #fff;
            padding: 10px 18px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 700;
            display: none;
        }

        .overlay-retry-btn:hover {
            background: #ff1b26;
            color: #fff;
            transform: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           LIVE STATUS
        ========================================================= */

        .live-status {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 35;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.68);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: opacity 0.3s ease;
        }

        .player-wrapper.hide-controls .live-status {
            opacity: 0;
            pointer-events: none;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: #E50914;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(229, 9, 20, 0.8);
            animation: livePulse 1.4s infinite;
        }

        @keyframes livePulse {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        .live-status-text {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .latency-text {
            font-size: 10px;
            color: #aaa;
            margin-left: 2px;
        }

        /* =========================================================
           GO LIVE BUTTON
        ========================================================= */

        .go-live-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            z-index: 35;
            background: #E50914;
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.45);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-5px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .go-live-btn.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .go-live-btn:hover {
            background: #ff1b26;
            color: #fff;
            transform: translateY(-1px);
        }

        .player-wrapper.hide-controls .go-live-btn {
            opacity: 0;
            pointer-events: none;
        }

        /* =========================================================
           NETWORK STATUS
        ========================================================= */

        .network-status {
            position: absolute;
            top: 52px;
            left: 15px;
            z-index: 35;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.62);
            color: #aaa;
            font-size: 9px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .network-status.show {
            opacity: 1;
        }

        .network-status.good {
            color: #7dff9b;
        }

        .network-status.medium {
            color: #ffd76a;
        }

        .network-status.bad {
            color: #ff7272;
        }

        /* =========================================================
           CONTROLS
        ========================================================= */

        .controls-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(
                180deg,
                rgba(20,20,20,0) 0%,
                rgba(20,20,20,0.85) 40%,
                rgba(20,20,20,0.98) 100%
            );
            padding: 20px 15px calc(15px + env(safe-area-inset-bottom, 0px)) 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 30;
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .player-wrapper.hide-controls .controls-container {
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
        }

        /* =========================================================
           PROGRESS
        ========================================================= */

        .progress-container {
            position: relative;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            cursor: pointer;
            transition: height 0.15s ease;
            touch-action: none;
        }

        .progress-container:hover {
            height: 8px;
        }

        .time-tooltip {
            position: absolute;
            bottom: 15px;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.9);
            color: #fff;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
            display: none;
            white-space: nowrap;
            z-index: 35;
        }

        .progress-container:hover .time-tooltip {
            display: block;
        }

        .buffer-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 2px;
            width: 0%;
            pointer-events: none;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #E50914;
            border-radius: 2px;
            width: 0%;
            pointer-events: none;
        }

        /* =========================================================
           CONTROLS ROW
        ========================================================= */

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left,
        .controls-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, color 0.15s, background 0.15s;
        }

        button:hover {
            color: #E50914;
            transform: scale(1.1);
        }

        #playPauseBtn {
            width: 28px;
            height: 28px;
            padding: 0;
        }

        #playPauseBtn svg {
            width: 22px;
            height: 22px;
            fill: #fff;
            transition: fill 0.15s;
        }

        #playPauseBtn:hover svg {
            fill: #E50914;
        }

        .time-text {
            font-size: 12px;
            color: #e5e5e5;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .live-badge {
            background: #E50914;
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 3px;
            letter-spacing: 1px;
        }

        .volume-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .custom-svg-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
            transition: fill 0.15s;
        }

        .custom-svg-btn:hover svg {
            fill: #E50914;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 60px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            accent-color: #E50914;
        }

        /* =========================================================
           MENUS
        ========================================================= */

        .menu-container {
            position: relative;
        }

        .dropdown-panel {
            position: absolute;
            bottom: 45px;
            right: 0;
            background: rgba(22, 22, 22, 0.97);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 10px;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 40;
            max-height: 70vh;
            overflow-y: auto;
        }

        .dropdown-panel.active {
            display: flex;
            gap: 15px;
        }

        .menu-column {
            display: flex;
            flex-direction: column;
            min-width: 125px;
        }

        .dropdown-header {
            font-size: 11px;
            color: #999;
            padding: 4px 8px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 6px;
        }

        .menu-option {
            background: none;
            border: none;
            color: #d2d2d2;
            text-align: left;
            padding: 7px 10px;
            font-size: 12px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
            white-space: nowrap;
        }

        .menu-option:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: none;
        }

        .menu-option.selected {
            color: #E50914;
            font-weight: 700;
            background: rgba(229, 9, 20, 0.1);
        }

        .quality-detail {
            display: block;
            color: #777;
            font-size: 9px;
            margin-top: 2px;
            font-weight: 500;
        }

        .icon-btn {
            font-size: 18px;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 768px) {
            .seek-overlay-btn {
                padding: 10px 14px;
                font-size: 13px;
            }

            .seek-left {
                left: 4%;
            }

            .seek-right {
                right: 4%;
            }

            .controls-left,
            .controls-right {
                gap: 8px;
            }

            .controls-container {
                padding-left: 10px;
                padding-right: 10px;
            }

            .live-status {
                top: 10px;
                left: 10px;
            }

            .go-live-btn {
                top: 10px;
                right: 10px;
            }

            .network-status {
                top: 45px;
                left: 10px;
            }

            .center-big-play-btn {
                width: 65px;
                height: 65px;
            }

            .center-big-play-btn svg {
                width: 30px;
                height: 30px;
            }

            .dropdown-panel {
                right: -5px;
                max-width: calc(100vw - 20px);
            }
        }

        @media (max-width: 600px) {
            .volume-wrapper input[type="range"] {
                display: none;
            }

            .time-text {
                font-size: 11px;
            }

            .live-badge {
                font-size: 9px;
            }

            .controls-left,
            .controls-right {
                gap: 6px;
            }

            .seek-overlay-btn {
                font-size: 12px;
                padding: 9px 12px;
            }
        }

        /* =========================================================
           LANDSCAPE MOBILE
        ========================================================= */

        @media (orientation: landscape) and (max-height: 600px) {
            .controls-container {
                padding-top: 12px;
                padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
                gap: 6px;
            }

            .live-status {
                top: 8px;
            }

            .go-live-btn {
                top: 8px;
            }

            .network-status {
                top: 39px;
            }

            .seek-overlay-btn {
                padding: 8px 12px;
            }
        }
    </style>
</head>

<body>

<div class="player-wrapper" id="playerWrapper">

    <!-- Canlı durum -->
    <div class="live-status" id="liveStatus">
        <span class="live-dot"></span>
        <span class="live-status-text" id="liveStatusText">CANLI</span>
        <span class="latency-text" id="latencyText"></span>
    </div>

    <!-- Canlıya dön -->
    <button class="go-live-btn" id="goLiveBtn">
        ● CANLIYA DÖN
    </button>

    <!-- Ağ durumu -->
    <div class="network-status" id="networkStatus">
        <span id="networkStatusText">Bağlantı kontrol ediliyor</span>
    </div>

    <!-- 10 saniye butonları -->
    <button
        class="seek-overlay-btn seek-left"
        id="overlayRewind"
        title="10 Saniye Geri">
        ◀ -10s
    </button>

    <button
        class="seek-overlay-btn seek-right"
        id="overlayForward"
        title="10 Saniye İleri">
        +10s ▶
    </button>

    <!-- Gesture bildirimi -->
    <div class="gesture-indicator" id="gestureIndicator">
        -10 saniye
    </div>

    <!-- Ortadaki play -->
    <div class="center-big-play-btn" id="centerBigPlayBtn">
        <svg id="centerPlayIconSvg" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>
    </div>

    <!-- Overlay -->
    <div class="player-overlay active" id="playerOverlay">

        <div class="netflix-spinner" id="netflixSpinner"></div>

        <div class="overlay-text" id="overlayText">
            Yayın Yükleniyor...
        </div>

        <div class="overlay-subtext" id="overlaySubtext"></div>

        <button class="overlay-retry-btn" id="overlayRetryBtn">
            Tekrar Dene
        </button>

    </div>

    <!-- Video -->
    <video
        id="videoElement"
        playsinline
        webkit-playsinline
        preload="auto">
    </video>

    <!-- Kontroller -->
    <div class="controls-container" id="controlsContainer">

        <div class="progress-container" id="progressContainer">

            <div class="time-tooltip" id="timeTooltip">
                00:00
            </div>

            <div class="buffer-bar" id="bufferBar"></div>

            <div class="progress-bar" id="progressBar"></div>

        </div>

        <div class="controls-row">

            <div class="controls-left">

                <!-- Play -->
                <button
                    id="playPauseBtn"
                    class="custom-svg-btn"
                    title="Oynat/Duraklat (K)">

                    <svg id="playPauseIconSvg" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>

                </button>

                <!-- Ses -->
                <div class="volume-wrapper">

                    <button
                        id="muteBtn"
                        class="custom-svg-btn"
                        title="Sesi Aç/Kapat (M)">

                        <svg id="volumeIconSvg" viewBox="0 0 24 24">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77-2.99-7.86-7-8.77-7-8.77z"/>
                        </svg>

                    </button>

                    <input
                        type="range"
                        id="volumeSlider"
                        min="0"
                        max="1"
                        step="0.05"
                        value="1">

                </div>

                <!-- Süre -->
                <div class="time-text" id="timeDisplay">
                    00:00:00
                </div>

                <div class="live-badge" id="liveBadge">
                    CANLI
                </div>

            </div>

            <div class="controls-right">

                <!-- Altyazı -->
                <div class="menu-container">

                    <button
                        id="subtitlesBtn"
                        class="custom-svg-btn"
                        title="Altyazılar">

                        <svg viewBox="0 0 24 24">
                            <path d="M19 4H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H7v1h4v2H7v1h4v1H6V9h5v2zm7 5h-5v-1h4v-1h-3v-1h3v-1h-4V9h5v7z"/>
                        </svg>

                    </button>

                    <div
                        class="dropdown-panel"
                        id="subtitlesDropdown"
                        style="flex-direction:column;">

                        <div class="dropdown-header">
                            Altyazı
                        </div>

                        <div
                            id="subtitlesListContainer"
                            style="display:flex; flex-direction:column;">
                        </div>

                    </div>

                </div>

                <!-- Ayarlar -->
                <div class="menu-container">

                    <button
                        id="settingsBtn"
                        class="icon-btn"
                        title="Ayarlar">
                        ⚙️
                    </button>

                    <div
                        class="dropdown-panel"
                        id="settingsDropdown">

                        <!-- Kalite -->
                        <div class="menu-column">

                            <div class="dropdown-header">
                                Kalite
                            </div>

                            <div id="qualityListContainer"></div>

                        </div>

                        <!-- Hız -->
                        <div class="menu-column">

                            <div class="dropdown-header">
                                Hız
                            </div>

                            <div id="speedListContainer">

                                <button
                                    class="menu-option"
                                    onclick="setSpeed(0.5)">
                                    0.5x
                                </button>

                                <button
                                    class="menu-option selected"
                                    onclick="setSpeed(1)">
                                    Normal (1x)
                                </button>

                                <button
                                    class="menu-option"
                                    onclick="setSpeed(1.25)">
                                    1.25x
                                </button>

                                <button
                                    class="menu-option"
                                    onclick="setSpeed(1.5)">
                                    1.5x
                                </button>

                                <button
                                    class="menu-option"
                                    onclick="setSpeed(2)">
                                    2.0x
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- PiP -->
                <button
                    id="pipBtn"
                    class="custom-svg-btn"
                    title="Resim İçinde Resim">

                    <svg viewBox="0 0 24 24">
                        <path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-0.9 2-2V5c0-1.1-.9-2-2-2zm0 16.01H3V4.99h18v14.02z"/>
                    </svg>

                </button>

                <!-- Fullscreen -->
                <button
                    id="fullscreenBtn"
                    class="icon-btn"
                    title="Tam Ekran (F)">
                    ⛶
                </button>

            </div>

        </div>

    </div>

</div>


<script>

    /* =========================================================
       DOM

    /* =========================================================
       LIVE EDGE
    ========================================================= */

    function getLiveEdge() {

        /*
         * Önce hls.js'in liveSyncPosition değerini kullan.
         */
        if (
            hls &&
            typeof hls.liveSyncPosition === 'number' &&
            isFinite(hls.liveSyncPosition)
        ) {

            return hls.liveSyncPosition;
        }


        /*
         * Son çare olarak seekable range.
         */
        try {

            if (video.seekable && video.seekable.length > 0) {

                return video.seekable.end(
                    video.seekable.length - 1
                );
            }

        } catch (e) {}

        return null;
    }


    function goLive() {

        const liveEdge = getLiveEdge();

        if (liveEdge === null) {
            return;
        }

        try {

            /*
             * Canlı noktasının tam ucuna değil,
             * küçük bir toleransla yaklaş.
             */
            video.currentTime =
                Math.max(0, liveEdge - 0.3);

        } catch (e) {

            console.warn(
                "Canlı noktaya gidilemedi:",
                e
            );
        }

        goLiveBtn.classList.remove('show');

        liveStatusText.textContent = 'CANLI';

        showGesture('● CANLI');

        resetHideTimer();
    }


    goLiveBtn.addEventListener('click', (e) => {

        e.stopPropagation();

        goLive();

    });


    /* =========================================================
       LIVE LATENCY
    ========================================================= */

    function updateLiveLatency() {

        if (!hls) {
            latencyText.textContent = '';
            return;
        }

        let latency = null;

        try {

            if (
                typeof hls.latency === 'number' &&
                isFinite(hls.latency)
            ) {

                latency = hls.latency;

            } else {

                const liveEdge = getLiveEdge();

                if (
                    liveEdge !== null &&
                    isFinite(video.currentTime)
                ) {

                    latency =
                        Math.max(
                            0,
                            liveEdge - video.currentTime
                        );
                }
            }

        } catch (e) {}

        if (
            latency !== null &&
            isFinite(latency)
        ) {

            latencyText.textContent =
                `${latency.toFixed(1)}s`;

            if (latency <= 5) {

                setNetworkStatus(
                    `Gecikme ${latency.toFixed(1)}s`,
                    'good',
                    false
                );

            } else if (latency <= 10) {

                setNetworkStatus(
                    `Gecikme ${latency.toFixed(1)}s`,
                    'medium',
                    false
                );

            } else {

                setNetworkStatus(
                    `Gecikme ${latency.toFixed(1)}s`,
                    'bad',
                    false
                );
            }

        } else {

            latencyText.textContent = '';

        }
    }


    /* =========================================================
       LIVE POSITION
    ========================================================= */

    function updateLivePosition() {

        const liveEdge = getLiveEdge();

        if (
            liveEdge === null ||
            !isFinite(video.currentTime)
        ) {
            goLiveBtn.classList.remove('show');
            return;
        }

        const distance =
            Math.max(
                0,
                liveEdge - video.currentTime
            );

        /*
         * 4 saniyeden fazla gerideyse CANLIYA DÖN.
         */
        if (distance > 4) {

            goLiveBtn.classList.add('show');

            liveStatusText.textContent =
                `CANLIDAN ${formatTime(distance)} GERİ`;

        } else {

            goLiveBtn.classList.remove('show');

            liveStatusText.textContent =
                'CANLI';
        }

        updateLiveLatency();
    }

    /* =========================================================
       CREATE HLS
    ========================================================= */

    function createHlsPlayer() {

        destroyHls(false);

        showLoadingOverlay(
            "Yayın Bağlanıyor...",
            "Canlı yayın bağlantısı kuruluyor."
        );

        isReconnecting = false;
        isStalled = false;

        hls = new Hls(HLS_CONFIG);

        hls.attachMedia(video);

        hls.on(
            Hls.Events.MEDIA_ATTACHED,
            () => {

                hls.loadSource(streamUrl);

            }
        );


        hls.on(
            Hls.Events.MANIFEST_LOADING,
            () => {

                setNetworkStatus(
                    "Yayın bağlantısı kuruluyor...",
                    "medium",
                    true
                );

            }
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            (event, data) => {

                reconnectAttempts = 0;

                hideOverlay();

                hideNetworkStatus();

                buildQualityMenu(data.levels || []);

                buildSubtitleMenu();

                updateLivePosition();

                setTimeout(() => {

                    /*
                     * İlk açılışta mümkünse canlı noktaya yaklaş.
                     */
                    if (
                        video.duration === Infinity ||
                        !isFinite(video.duration)
                    ) {
                        goLive();
                    }

                }, 300);

            }
        );


        hls.on(
            Hls.Events.LEVEL_SWITCHED,
            (event, data) => {

                currentQualityIndex = data.level;

                updateQualitySelectedUI(
                    currentQualityIndex
                );

            }
        );


        hls.on(
            Hls.Events.FRAG_LOADED,
            () => {

                lastProgressTimestamp = Date.now();

                if (isReconnecting) {

                    isReconnecting = false;

                    reconnectAttempts = 0;

                    hideOverlay();

                    hideNetworkStatus();
                }

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (event, data) => {

                console.warn(
                    "HLS:",
                    data.type,
                    data.details,
                    data.fatal
                );


                if (
                    data.details ===
                    Hls.ErrorDetails.BUFFER_STALLED_ERROR
                ) {

                    handleStall(
                        "Buffer bekleniyor..."
                    );
                }


                if (!data.fatal) {
                    return;
                }


                if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    scheduleReconnect(
                        "Bağlantı koptu. Yeniden bağlanılıyor..."
                    );

                } else if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    setNetworkStatus(
                        "Medya kurtarılıyor...",
                        "medium",
                        true
                    );

                    try {

                        hls.recoverMediaError();

                    } catch (e) {

                        scheduleReconnect(
                            "Yayın kurtarılamadı. Yeniden bağlanılıyor..."
                        );
                    }

                } else {

                    scheduleReconnect(
                        "Yayın hatası. Yeniden bağlanılıyor..."
                    );
                }

            }
        );
    }

    /* =========================================================
       DESTROY HLS
    ========================================================= */

    function destroyHls(clearSource = true) {

        if (hls) {

            try {

                hls.stopLoad();

            } catch (e) {}

            try {

                hls.detachMedia();

            } catch (e) {}

            try {

                hls.destroy();

            } catch (e) {}

            hls = null;
        }

        if (clearSource) {

            try {

                video.removeAttribute('src');

                video.load();

            } catch (e) {}
        }
    }


    /* =========================================================
       AUTO RECONNECT
    ========================================================= */

    function scheduleReconnect(reason) {

        if (reconnectTimer) {
            return;
        }

        if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {

            showLoadingOverlay(
                "Yayın Bağlantısı Kesildi",
                "Otomatik yeniden bağlanma sınırına ulaşıldı.",
                true
            );

            setNetworkStatus(
                "Bağlantı kurulamadı",
                "bad",
                true
            );

            return;
        }


        reconnectAttempts++;

        isReconnecting = true;


        const delay =
            Math.min(
                1000 * Math.pow(1.5, reconnectAttempts - 1),
                8000
            );


        showLoadingOverlay(
            "Yayın Yeniden Bağlanıyor...",
            `${reason} (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`
        );


        setNetworkStatus(
            `Yeniden bağlanılıyor... ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS}`,
            "medium",
            true
        );


        reconnectTimer = setTimeout(() => {

            reconnectTimer = null;

            if (hls) {

                try {

                    hls.stopLoad();

                } catch (e) {}

                try {

                    hls.detachMedia();

                } catch (e) {}

                try {

                    hls.destroy();

                } catch (e) {}
            }

            hls = null;

            createHlsPlayer();

        }, delay);

    }

       MANUAL RETRY
    ========================================================= */

    overlayRetryBtn.addEventListener(
        'click',
        () => {

            reconnectAttempts = 0;

            if (reconnectTimer) {

                reconnectTimer = null;

                createHlsPlayer();

            } else {

                try {

                    video.play().catch(() => {});

        }

    /* =========================================================
       STALL DETECTION
    ========================================================= */

    function handleStall(reason = "Yayın yükleniyor...") {

        if (isStalled) {
            return;
        }

        isStalled = true;

        showLoadingOverlay(
            "Yayın Takıldı",
            reason
        );

        setNetworkStatus(
            "Buffer bekleniyor...",
            "medium",
            true
        );


        clearTimeout(stallTimer);

        stallTimer = setTimeout(() => {

            if (!video.paused && isStalled) {

                try {

                    const liveEdge = getLiveEdge();

                    if (
                        liveEdge !== null &&
                        isFinite(liveEdge)
                    ) {

                        const distance =
                            liveEdge - video.currentTime;

                        /*
                         * Çok geride kaldıysa direkt canlıya yaklaş.
                         */
                        if (distance > 8) {

                            video.currentTime =
                                Math.max(
                                    0,
                                    liveEdge - 1
                                );

                        }
                    }

                } catch (e) {}


                /*
                 * Hâlâ takılıysa HLS reconnect.
                 */
                setTimeout(() => {

                    if (
                        !video.paused &&
                        isStalled
                    ) {

                        scheduleReconnect(
                            "Yayın uzun süre yanıt vermedi."
                        );

                    }

                }, 3000);
            }

        }, 3500);

    }


    function clearStall() {

        isStalled = false;

        clearTimeout(stallTimer);

        stallTimer = null;

        hideOverlay();

        hideNetworkStatus();

        lastProgressTimestamp = Date.now();
    }


    video.addEventListener(
        'waiting',
        () => {

            if (!video.paused) {

                handleStall(
                    "Yayın yeniden yükleniyor..."
                );
            }

        }
    );


    video.addEventListener(
        'stalled',
        () => {

            if (!video.paused) {

                handleStall(
                    "Bağlantı yavaşladı..."
                );
            }

        }
    );


    video.addEventListener(
        'playing',
        () => {

            clearStall();

            hideOverlay();

            reconnectAttempts = 0;

            setNetworkStatus(
                "Yayın aktif",
                "good",
                false
            );

        }
    );


    video.addEventListener(
        'progress',
        () => {

            lastProgressTimestamp = Date.now();

        }
    );


    /* =========================================================
       QUALITY MENU
    ========================================================= */

    function buildQualityMenu(levels) {

        qualityListContainer.innerHTML = '';

        currentQualityIndex = -1;


        const autoBtn =
            document.createElement('button');

        autoBtn.className =
            'menu-option selected';

        autoBtn.innerHTML =
            `Otomatik
             <span class="quality-detail">
                Adaptif kalite
             </span>`;


        autoBtn.onclick = () => {

            if (hls) {

                hls.currentLevel = -1;

                hls.loadLevel = -1;

            }

            currentQualityIndex = -1;

            updateSelectedUI(
                autoBtn,
                qualityListContainer
            );

        };


        qualityListContainer.appendChild(
            autoBtn
        );


        /*
         * Duplicate çözünürlükleri azalt.
         */
        const seen = new Set();


        levels.forEach(
            (level, index) => {

                const height =
                    level.height || 0;

                const bitrate =
                    level.bitrate || 0;

                const width =
                    level.width || 0;

                const fps =
                    level.frameRate || 0;


                const key =
                    `${height}-${bitrate}-${width}`;


                if (seen.has(key)) {
                    return;
                }

                seen.add(key);


                const btn =
                    document.createElement('button');

                btn.className =
                    'menu-option';


                let title;

                if (height) {

                    title =
                        `${height}p`;

                } else {

                    title =
                        `Seviye ${index + 1}`;
                }


                let details = [];


                if (bitrate) {

                    details.push(
                        formatBitrate(bitrate)
                    );
                }


                if (fps) {

                    details.push(
                        `${Math.round(fps)} FPS`
                    );
                }


                btn.innerHTML =
                    `${title}
                     <span class="quality-detail">
                        ${details.join(' • ')}
                     </span>`;


                btn.onclick = () => {

                    if (!hls) {
                        return;
                    }

                    hls.currentLevel = index;

                    hls.loadLevel = index;

                    currentQualityIndex =
                        index;

                    updateQualitySelectedUI(
                        index
                    );

                    settingsDropdown.classList.remove(
                        'active'
                    );

                };


                qualityListContainer.appendChild(
                    btn
                );

            }
        );


        /*
         * HLS master playlistinde hiç quality
         * bulunmuyorsa.
         */
        if (levels.length === 0) {

            const noQuality =
                document.createElement('div');

            noQuality.className =
                'menu-option';

            noQuality.textContent =
                'Kalite seçimi kullanılamıyor';

            noQuality.style.color =
                '#777';

            qualityListContainer.appendChild(
                noQuality
            );
        }
    }


    function formatBitrate(bitrate) {

        if (!bitrate) {
            return '';
        }

        if (bitrate >= 1000000) {

            return `${(bitrate / 1000000).toFixed(1)} Mbps`;

        }

        return `${Math.round(bitrate / 1000)} kbps`;
    }


    function updateQualitySelectedUI(levelIndex) {

        const buttons =
            qualityListContainer.querySelectorAll(
                '.menu-option'
            );

        buttons.forEach(
            btn => btn.classList.remove('selected')
        );


        if (levelIndex === -1) {

            if (buttons[0]) {

                buttons[0].classList.add(
                    'selected'
                );
            }

            return;
        }


        /*
         * Menüde duplicate çözünürlükler filtrelendiği
         * için HLS index ile UI index birebir olmayabilir.
         * Aktif çözünürlüğü metin üzerinden işaretle.
         */
        const activeLevel =
            hls &&
            hls.levels &&
            hls.levels[levelIndex];


        if (!activeLevel) {
            return;
        }


        const height =
            activeLevel.height;


        buttons.forEach(
            btn => {

                if (
                    height &&
                    btn.textContent.includes(
                        `${height}p`
                    )
                ) {

                    btn.classList.add(
                        'selected'
                    );
                }

            }
        );
    }

                    'hidden';
            }


            updateSelectedUI(
                offBtn,

            );
        };


        subtitlesListContainer.appendChild(
            offBtn

        if (
            video.textTracks &&
            video.textTracks.length > 0

                let i = 0;
                i < video.textTracks.length;
                i++
            ) {

                const track =
                    video.textTracks[i];

                const btn =
                    document.createElement('button');

                btn.className =
                    'menu-option';

                btn.textContent =
                    track.label ||
                    track.language ||
                    `Altyazı ${i + 1}`;

                        j < video.textTracks.length;

                    }


                    updateSelectedUI(
                        btn,
                        subtitlesListContainer

                subtitlesListContainer.appendChild(
                    btn

    /* =========================================================
       SEEK
    ========================================================= */

    function seekBy(seconds) {

        if (!isFinite(video.currentTime)) {
            return;
        }


        const duration =
            video.duration;


        if (
            isFinite(duration) &&
            duration > 0
        ) {

            video.currentTime =
                Math.max(
                    0,
                    Math.min(
                        duration,
                        video.currentTime + seconds
                    )
                );

        } else {

            try {

                const liveEdge =
                    getLiveEdge();

                if (liveEdge !== null) {

                    video.currentTime =
                        Math.max(
                            0,
                            video.currentTime + seconds
                        );
                }

            } catch (e) {}

        }


        showGesture(
            seconds > 0
                ? '+10 saniye'
                : '-10 saniye'
        );

        resetHideTimer();
    }

    /* =========================================================
       MOBILE DOUBLE TAP
    ========================================================= */

    playerWrapper.addEventListener(
        'click',
        (e) => {

            if (
                e.target.closest(
                    '.controls-container'
                ) ||
                e.target.closest(
                    '.seek-overlay-btn'
                ) ||
                e.target.closest(
                    '.center-big-play-btn'
                ) ||
                e.target.closest(
                    '.dropdown-panel'
                ) ||
                e.target.closest(
                    '.go-live-btn'
                )
            ) {

                return;
            }


            const now =
                Date.now();

            const tapLength =
                now - lastTap;


            if (
                tapLength < 300 &&
                tapLength > 0
            ) {

                /*
                 * Çift tık/tap.
                 */
                const rect =
                    playerWrapper.getBoundingClientRect();

                const x =
                    e.clientX - rect.left;

                if (
                    x <
                    rect.width * 0.35
                ) {

                    seekBy(-10);

                } else if (
                    x >
                    rect.width * 0.65
                ) {

                    seekBy(10);

                } else {

                    toggleFullscreen();

                }

                e.preventDefault();

            } else {

                if (
                    playerWrapper.classList.contains(
                        'hide-controls'
                    )
                ) {

                    playerWrapper.classList.remove(
                        'hide-controls'
                    );

                    resetHideTimer();

                } else {

                    resetHideTimer();

                }

            }


            lastTap = now;

        }
    );


    /* =========================================================
       TOUCH GESTURES
    ========================================================= */

    playerWrapper.addEventListener(
        'touchstart',
        (e) => {

            if (
                e.target.closest(
                    '.controls-container'
                ) ||
                e.target.closest(
                    '.dropdown-panel'
                ) ||
                e.target.closest(
                    'button'
                )
            ) {

                return;
            }


            if (
                !e.touches ||
                e.touches.length !== 1
            ) {

                return;
            }


            const touch =
                e.touches[0];

            touchStartX =
                touch.clientX;

            touchStartY =
                touch.clientY;

            touchStartTime =
                Date.now();

        },
        { passive: true }
    );


    playerWrapper.addEventListener(
        'touchend',
        (e) => {

            if (
                !e.changedTouches ||
                !e.changedTouches.length
            ) {

                return;
            }


            const touch =
                e.changedTouches[0];


            const dx =
                touch.clientX - touchStartX;

            const dy =
                touch.clientY - touchStartY;


            const elapsed =
                Date.now() - touchStartTime;


            /*
             * Yatay swipe.
             */
            if (
                Math.abs(dx) > 80 &&
                Math.abs(dx) > Math.abs(dy)
            ) {

                if (dx > 0) {

                    seekBy(-10);

                } else {

                    seekBy(10);

                }

                return;
            }


            /*
             * Dikey swipe.
             * Sol tarafta parlaklık yerine kontrollü ses.
             */
            if (
                Math.abs(dy) > 80 &&
                Math.abs(dy) > Math.abs(dx)
            ) {

                const rect =
                    playerWrapper.getBoundingClientRect();

                const x =
                    touch.clientX - rect.left;


                /*
                 * Sağ tarafta ses.
                 */
                if (
                    x >
                    rect.width * 0.55
                ) {

                    if (dy < 0) {

                        video.volume =
                            Math.min(
                                1,
                                video.volume + 0.1
                            );

                    } else {

                        video.volume =
                            Math.max(
                                0,
                                video.volume - 0.1
                            );
                    }


                    video.muted =
                        video.volume === 0;

                    volumeSlider.value =
                        video.volume;

                    updateVolumeIcon();


                    showGesture(
                        `Ses %${Math.round(
                            video.volume * 100
                        )}`
                    );

                    resetHideTimer();

                }

                return;
            }


            /*
             * Uzun basma:
             * 500ms üzeri -> geçici 1.5x
             */
            if (elapsed >= 500) {

                const oldRate =
                    video.playbackRate;

                video.playbackRate = 1.5;

                showGesture('1.5x');


                const releaseRate =
                    () => {

                        video.playbackRate =
                            oldRate;

                        playerWrapper.removeEventListener(
                            'touchend',
                            releaseRate
                        );
                    };

                playerWrapper.addEventListener(
                    'touchend',
                    releaseRate,
                    { once: true }
                );

            }

        },
        { passive: true }
    );


    /* =========================================================
       TIME UPDATE
    ========================================================= */

    video.addEventListener(
        'timeupdate',
        () => {

            if (isDragging) {
                return;
            }


            const current =
                video.currentTime;

            const duration =
                video.duration;


            if (
                isFinite(duration) &&
                duration > 0
            ) {

                progressBar.style.width =
                    `${(current / duration) * 100}%`;

                timeDisplay.textContent =
                    formatTime(current);

                liveBadge.style.display =
                    'none';

            } else {

                timeDisplay.textContent =
                    formatTime(current);

                liveBadge.style.display =
                    'inline-block';

            }


            /*
             * Buffer.
             */
            if (
                video.buffered &&
                video.buffered.length > 0
            ) {

                try {

                    const bufferedEnd =
                        video.buffered.end(
                            video.buffered.length - 1
                        );


                    if (
                        isFinite(duration) &&
                        duration > 0
                    ) {

                        bufferBar.style.width =
                            `${Math.min(
                                100,
                                (bufferedEnd / duration) * 100
                            )}%`;

                    }

                } catch (e) {}
            }


            updateLivePosition();

            lastPlayingTime =
                current;

            lastProgressTimestamp =
                Date.now();

        }
    );

    /* =========================================================

    ========================================================= */

    function getClampedPos(e) {

        const rect =
            progressContainer.getBoundingClientRect();

        const clientX =
            e.touches
                ? e.touches[0].clientX
                : e.clientX;


        return Math.max(
            0,
            Math.min(
                1,
                (
                    clientX -
                    rect.left
                ) /
                rect.width
            )
        );
    }

    /* =========================================================
       FORMAT TIME
    ========================================================= */

    function formatTime(seconds) {

        if (
            !isFinite(seconds) ||
            seconds < 0
        ) {

            return '00:00';
        }


        const h =
            Math.floor(
                seconds / 3600
            );

        const m =
            Math.floor(
                (seconds % 3600) / 60
            );

        const s =
            Math.floor(
                seconds % 60
            );


        if (h > 0) {

            return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;

        }


        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;

    }

    async function toggleFullscreen() {

        try {

            if (!document.fullscreenElement) {

                await playerWrapper.requestFullscreen();

                playerWrapper.classList.add(
                    'is-fullscreen'
                );


                /*
                 * Mobil cihazlarda destekleniyorsa
                 * yatay moda geç.
                 */
                if (
                    screen.orientation &&
                    screen.orientation.lock
                ) {

                    try {

                        await screen.orientation.lock(
                            'landscape'
                        );

                    } catch (e) {

                        /*
                         * iOS/Safari gibi tarayıcılarda
                         * desteklenmeyebilir.
                         */

                    }
                }

            } else {

                await document.exitFullscreen();

            }

        } catch (err) {

            console.warn(
                "Fullscreen Hatası:",
                err
            );

        }

    }


    document.addEventListener(

        () => {

            if (document.fullscreenElement) {

                playerWrapper.classList.add(
                    'is-fullscreen'
                );

            } else {

                playerWrapper.classList.remove(
                    'is-fullscreen'
                );


                if (
                    screen.orientation &&
                    screen.orientation.unlock
                ) {

                    try {

                        screen.orientation.unlock();

                    } catch (e) {}

                }

            }

            resetHideTimer();

        }
    );


    /* =========================================================
       KEYBOARD
    ========================================================= */

    document.addEventListener(
        'keydown',
        (e) => {

            if (
                ['INPUT', 'TEXTAREA'].includes(
                    document.activeElement.tagName
                )
            ) {

                return;
            }


            const key =
                e.key.toLowerCase();


            if (
                key === ' ' ||
                key === 'k'
            ) {

                e.preventDefault();

                togglePlay();

                resetHideTimer();

            } else if (
                key === 'f'
            ) {

                e.preventDefault();

                toggleFullscreen();

                resetHideTimer();

            } else if (
                key === 'm'
            ) {

                e.preventDefault();

                muteBtn.click();

            } else if (
                key === 'l'
            ) {

                e.preventDefault();

                goLive();

            } else if (
                key === 'arrowright'
            ) {

                e.preventDefault();

                seekBy(10);

            } else if (
                key === 'arrowleft'
            ) {

                e.preventDefault();

                seekBy(-10);

            } else if (
                key === 'arrowup'
            ) {

                e.preventDefault();

                video.volume =
                    Math.min(
                        1,
                        video.volume + 0.05
                    );

                video.muted = false;

                volumeSlider.value =
                    video.volume;

                updateVolumeIcon();

                resetHideTimer();

            } else if (
                key === 'arrowdown'
            ) {

                e.preventDefault();

                video.volume =
                    Math.max(
                        0,
                        video.volume - 0.05
                    );

                if (
                    video.volume === 0
                ) {

                    video.muted = true;
                }

                volumeSlider.value =
                    video.volume;

                updateVolumeIcon();

                resetHideTimer();

            }

        }
    );


    /* =========================================================
       AUTO HIDE CONTROLS
    ========================================================= */

    function resetHideTimer() {

        playerWrapper.classList.remove(
            'hide-controls'
        );


        clearTimeout(
            hideTimeout
        );


        hideTimeout =
            setTimeout(
                () => {

                    if (
                        !video.paused &&
                        !settingsDropdown.classList.contains(
                            'active'
                        ) &&
                        !subtitlesDropdown.classList.contains(
                            'active'
                        )
                    ) {

                        playerWrapper.classList.add(
                            'hide-controls'
                        );

                    }

                },
                3000
            );
    }


    playerWrapper.addEventListener(

    );


    playerWrapper.addEventListener(
        'touchstart',
        resetHideTimer,
        { passive: true }
    );


    /* =========================================================
       VISIBILITY / TAB CHANGE
    ========================================================= */

    document.addEventListener(
        'visibilitychange',
        () => {

            if (
                document.visibilityState ===
                'visible'
            ) {

                resetHideTimer();

                /*
                 * Kullanıcı sekmeye geri döndüğünde
                 * yayın uzun süre durmuşsa kontrol et.
                 */
                if (
                    hls &&
                    !video.paused
                ) {

                    try {

                        hls.startLoad();

                    } catch (e) {}

                }

            }

        }
    );


    /* =========================================================
       ONLINE / OFFLINE
    ========================================================= */

    window.addEventListener(
        'offline',
        () => {

            setNetworkStatus(
                "İnternet bağlantısı kesildi",
                "bad",
                true
            );

            showLoadingOverlay(
                "İnternet Bağlantısı Kesildi",
                "Bağlantı geri geldiğinde yayın otomatik olarak yeniden denenecek."
            );

        }
    );


    window.addEventListener(
        'online',
        () => {

            setNetworkStatus(
                "İnternet bağlantısı geri geldi",
                "good",
                true
            );


            reconnectAttempts = 0;


            if (hls) {

                try {

                    hls.startLoad();

                } catch (e) {}

            } else if (streamUrl) {

                createHlsPlayer();

            }


            setTimeout(
                hideNetworkStatus,
                2000
            );

        }
    );


    /* =========================================================
       INITIALIZE
    ========================================================= */

    initPlayer();

</script>

</body>
    </html>
