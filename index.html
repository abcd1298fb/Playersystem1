<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Özel Arayüzlü HLS.js Player</title>
    <!-- hls.js kütüphanesini projeye dahil ediyoruz -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1015;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .player-container {
            position: relative;
            width: 800px;
            max-width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
            transition: filter 0.2s ease;
        }

        /* Özel Kontrol Paneli */
        .controls-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            display: flex;
            align-items: center;
            padding: 12px 15px;
            gap: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .player-container:hover .controls-bar {
            opacity: 1;
        }

        button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            color: #3b82f6;
        }

        .time-display {
            font-size: 13px;
            color: #ddd;
            min-width: 80px;
        }

        .spacer {
            flex-grow: 1;
        }

        select, input[type="range"] {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        select option {
            background: #1a1a1a;
            color: #fff;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        input[type="range"] {
            width: 80px;
            accent-color: #3b82f6;
        }
    </style>
</head>
<body>

    <div class="player-container" id="playerContainer">
        <video id="videoPlayer"></video>

        <div class="controls-bar" id="controlsBar">
            <button id="playPauseBtn" title="Oynat/Duraklat">▶</button>
            
            <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
            
            <div class="control-group">
                <span>Ses:</span>
                <input type="range" id="volumeRange" min="0" max="1" step="0.05" value="1">
            </div>

            <div class="control-group">
                <span>Parlaklık:</span>
                <input type="range" id="brightnessRange" min="0.5" max="1.5" step="0.1" value="1">
            </div>

            <div class="spacer"></div>

            <div class="control-group">
                <span>Kalite:</span>
                <select id="qualitySelect">
                    <option value="-1">Otomatik</option>
                </select>
            </div>

            <button id="fullscreenBtn" title="Tam Ekran">⛶</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const playerContainer = document.getElementById('playerContainer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const volumeRange = document.getElementById('volumeRange');
        const brightnessRange = document.getElementById('brightnessRange');
        const qualitySelect = document.getElementById('qualitySelect');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // Test etmek istediğin canlı yayın linki
        const streamUrl = 'https://corestream.siteyaptim.live//bein1/tracks-v1a1/mono.m3u8';

        // --- 1. ARAYÜZ KONTROLLERİ ---

        playPauseBtn.addEventListener('click', togglePlay);
        video.addEventListener('click', togglePlay);

        function togglePlay() {
            if (video.paused) {
                video.play();
                playPauseBtn.textContent = '❚❚';
            } else {
                video.pause();
                playPauseBtn.textContent = '▶';
            }
        }

        video.addEventListener('timeupdate', () => {
            const current = video.currentTime;
            const duration = video.duration;
            // Canlı yayınlarda duration Infinity olabilir
            const durationText = isFinite(duration) ? formatTime(duration) : 'Canlı Yayın';
            timeDisplay.textContent = `${formatTime(current)} / ${durationText}`;
        });

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        volumeRange.addEventListener('input', (e) => {
            video.volume = e.target.value;
        });

        brightnessRange.addEventListener('input', (e) => {
            video.style.filter = `brightness(${e.target.value})`;
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                playerContainer.requestFullscreen().catch(err => console.error(err));
            } else {
                document.exitFullscreen();
            }
        });

        // --- 2. HLS.JS MOTORU ENTEGRASYONU ---

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                console.HlsLog = 'Manifest yüklendi, kalite seviyeleri ayarlanıyor.';
                
                // Kalite seçeneklerini dolduruyoruz
                qualitySelect.innerHTML = '<option value="-1">Otomatik</option>';
                data.levels.forEach((level, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.text = level.height ? `${level.heightp}` : `Seviye ${index + 1}`;
                    qualitySelect.appendChild(option);
                });
            });

            // Kullanıcı arayüzden kalite değiştirdiğinde
            qualitySelect.addEventListener('change', (e) => {
                hls.currentLevel = parseInt(e.target.value);
            });

            // Otomatik oynatma denemesi
            video.addEventListener('loadedmetadata', () => {
                video.play().catch(() => {
                    console.log('Tarayıcı otomatik oynatmayı engelledi, kullanıcı etkileşimi bekleniyor.');
                });
            });

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari gibi yerel HLS destekleyen tarayıcılar için
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', () => {
                video.play();
            });
        } else {
            alert('Tarayıcınız bu HLS akışını desteklemiyor.');
        }
    </script>
</body>
</html>
