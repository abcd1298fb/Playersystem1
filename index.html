<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>plyr</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .player-wrapper {
            position: relative;
            width: 100vw;
            height: 100svh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .player-wrapper.is-fullscreen {
            width: 100vw;
            height: 100dvh;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        /* =========================================================
           SEEK BUTTONS
        ========================================================= */

        .seek-overlay-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.62);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            padding: 15px 20px;
            border-radius: 50px;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.9;
            transition: background 0.2s, transform 0.2s, opacity 0.3s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .player-wrapper.hide-controls .seek-overlay-btn {
            opacity: 0;
            pointer-events: none;
        }

        .seek-overlay-btn:hover {
            background: rgba(229, 9, 20, 0.8);
            border-color: #E50914;
            transform: translateY(-50%) scale(1.05);
        }

        .seek-left {
            left: 8%;
        }

        .seek-right {
            right: 8%;
        }

        /* =========================================================
           MOBILE GESTURE INDICATOR
        ========================================================= */

        .gesture-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.75);
            min-width: 120px;
            padding: 18px 22px;
            background: rgba(0, 0, 0, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .gesture-indicator.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* =========================================================
           CENTER PLAY
        ========================================================= */

        .center-big-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 75px;
            height: 75px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 22;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .center-big-play-btn.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .center-big-play-btn svg {
            width: 36px;
            height: 36px;
            fill: #fff;
        }

        /* =========================================================
           PLAYER OVERLAY
        ========================================================= */

        .player-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 10, 0.90);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.35s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 25;
            text-align: center;
            padding: 20px;
        }

        .player-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .netflix-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #E50914;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .overlay-text {
            margin-top: 15px;
            font-size: 15px;
            color: #b3b3b3;
            font-weight: 500;
            max-width: 90%;
        }

        .overlay-subtext {
            margin-top: 8px;
            font-size: 12px;
            color: #777;
            max-width: 90%;
        }

        .overlay-retry-btn {
            margin-top: 18px;
            background: #E50914;
            color: #fff;
            padding: 10px 18px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 700;
            display: none;
        }

        .overlay-retry-btn:hover {
            background: #ff1b26;
            color: #fff;
            transform: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           LIVE STATUS
        ========================================================= */

        .live-status {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 35;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.68);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: opacity 0.3s ease;
        }

        .player-wrapper.hide-controls .live-status {
            opacity: 0;
            pointer-events: none;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: #E50914;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(229, 9, 20, 0.8);
            animation: livePulse 1.4s infinite;
        }

        @keyframes livePulse {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        .live-status-text {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .latency-text {
            font-size: 10px;
            color: #aaa;
            margin-left: 2px;
        }

        /* =========================================================
           GO LIVE BUTTON
        ========================================================= */

        .go-live-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            z-index: 35;
            background: #E50914;
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.45);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-5px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .go-live-btn.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .go-live-btn:hover {
            background: #ff1b26;
            color: #fff;
            transform: translateY(-1px);
        }

        .player-wrapper.hide-controls .go-live-btn {
            opacity: 0;
            pointer-events: none;
        }

        /* =========================================================
           NETWORK STATUS
        ========================================================= */

        .network-status {
            position: absolute;
            top: 52px;
            left: 15px;
            z-index: 35;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.62);
            color: #aaa;
            font-size: 9px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .network-status.show {
            opacity: 1;
        }

        .network-status.good {
            color: #7dff9b;
        }

        .network-status.medium {
            color: #ffd76a;
        }

        .network-status.bad {
            color: #ff7272;
        }

        /* =========================================================
           CONTROLS
        ========================================================= */

        .controls-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(
                180deg,
                rgba(20,20,20,0) 0%,
                rgba(20,20,20,0.85) 40%,
                rgba(20,20,20,0.98) 100%
            );
            padding: 20px 15px calc(15px + env(safe-area-inset-bottom, 0px)) 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 30;
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .player-wrapper.hide-controls .controls-container {
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
        }

        /* =========================================================
           PROGRESS
        ========================================================= */

        .progress-container {
            position: relative;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            cursor: pointer;
            transition: height 0.15s ease;
            touch-action: none;
        }

        .progress-container:hover {
            height: 8px;
        }

        .time-tooltip {
            position: absolute;
            bottom: 15px;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.9);
            color: #fff;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
            display: none;
            white-space: nowrap;
            z-index: 35;
        }

        .progress-container:hover .time-tooltip {
            display: block;
        }

        .buffer-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 2px;
            width: 0%;
            pointer-events: none;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #E50914;
            border-radius: 2px;
            width: 0%;
            pointer-events: none;
        }

        /* =========================================================
           CONTROLS ROW
        ========================================================= */

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left,
        .controls-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, color 0.15s, background 0.15s;
        }

        button:hover {
            color: #E50914;
            transform: scale(1.1);
        }

        #playPauseBtn {
            width: 28px;
            height: 28px;
            padding: 0;
        }

        #playPauseBtn svg {
            width: 22px;
            height: 22px;
            fill: #fff;
            transition: fill 0.15s;
        }

        #playPauseBtn:hover svg {
            fill: #E50914;
        }

        .time-text {
            font-size: 12px;
            color: #e5e5e5;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .live-badge {
            background: #E50914;
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 3px;
            letter-spacing: 1px;
        }

        .volume-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .custom-svg-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
            transition: fill 0.15s;
        }

        .custom-svg-btn:hover svg {
            fill: #E50914;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 60px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            accent-color: #E50914;
        }

        /* =========================================================
           MENUS
        ========================================================= */

        .menu-container {
            position: relative;
        }

        .dropdown-panel {
            position: absolute;
            bottom: 45px;
            right: 0;
            background: rgba(22, 22, 22, 0.97);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 10px;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 40;
            max-height: 70vh;
            overflow-y: auto;
        }

        .dropdown-panel.active {
            display: flex;
            gap: 15px;
        }

        .menu-column {
            display: flex;
            flex-direction: column;
            min-width: 125px;
        }

        .dropdown-header {
            font-size: 11px;
            color: #999;
            padding: 4px 8px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 6px;
        }

        .menu-option {
            background: none;
            border: none;
            color: #d2d2d2;
            text-align: left;
            padding: 7px 10px;
            font-size: 12px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
            white-space: nowrap;
        }

        .menu-option:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: none;
        }

        .menu-option.selected {
            color: #E50914;
            font-weight: 700;
            background: rgba(229, 9, 20, 0.1);
        }

        .quality-detail {
            display: block;
            color: #777;
            font-size: 9px;
            margin-top: 2px;
            font-weight: 500;
        }

        .icon-btn {
            font-size: 18px;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 768px) {
            .seek-overlay-btn {
                padding: 10px 14px;
                font-size: 13px;
            }

            .seek-left {
                left: 4%;
            }

            .seek-right {
                right: 4%;
            }

            .controls-left,
            .controls-right {
                gap: 8px;
            }

            .controls-container {
                padding-left: 10px;
                padding-right: 10px;
            }

            .live-status {
                top: 10px;
                left: 10px;
            }

            .go-live-btn {
                top: 10px;
                right: 10px;
            }

            .network-status {
                top: 45px;
                left: 10px;
            }

            .center-big-play-btn {
                width: 65px;
                height: 65px;
            }

            .center-big-play-btn svg {
                width: 30px;
                height: 30px;
            }

            .dropdown-panel {
                right: -5px;
                max-width: calc(100vw - 20px);
            }
        }

        @media (max-width: 600px) {
            .volume-wrapper input[type="range"] {
                display: none;
            }

            .time-text {
                font-size: 11px;
            }

            .live-badge {
                font-size: 9px;
            }

            .controls-left,
            .controls-right {
                gap: 6px;
            }

            .seek-overlay-btn {
                font-size: 12px;
                padding: 9px 12px;
            }
        }

        /* =========================================================
           LANDSCAPE MOBILE
        ========================================================= */

        @media (orientation: landscape) and (max-height: 600px) {
            .controls-container {
                padding-top: 12px;
                padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
                gap: 6px;
            }

            .live-status {
                top: 8px;
            }

            .go-live-btn {
                top: 8px;
            }

            .network-status {
                top: 39px;
            }

            .seek-overlay-btn {
                padding: 8px 12px;
            }
        }
    </style>
</head>

<body>

<div class="player-wrapper" id="playerWrapper">

    <!-- Canlı durum -->
    <div class="live-status" id="liveStatus">
        <span class="live-dot"></span>
        <span class="live-status-text" id="liveStatusText">CANLI</span>
        <span class="latency-text" id="latencyText"></span>
    </div>

    <!-- Canlıya dön -->
    <button class="go-live-btn" id="goLiveBtn">
        ● CANLIYA DÖN
    </button>

    <!-- Ağ durumu -->
    <div class="network-status" id="networkStatus">
        <span id="networkStatusText">Bağlantı kontrol ediliyor</span>
    </div>

    <!-- 10 saniye butonları -->
    <button
        class="seek-overlay-btn seek-left"
        id="overlayRewind"
        title="10 Saniye Geri">
        ◀ -10s
    </button>

    <button
        class="seek-overlay-btn seek-right"
        id="overlayForward"
        title="10 Saniye İleri">
        +10s ▶
    </button>

    <!-- Gesture bildirimi -->
    <div class="gesture-indicator" id="gestureIndicator">
        -10 saniye
    </div>

    <!-- Ortadaki play -->
    <div class="center-big-play-btn" id="centerBigPlayBtn">
        <svg id="centerPlayIconSvg" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>
    </div>

    <!-- Overlay -->
    <div class="player-overlay active" id="playerOverlay">

        <div class="netflix-spinner" id="netflixSpinner"></div>

        <div class="overlay-text" id="overlayText">
            Yayın Yükleniyor...
        </div>

        <div class="overlay-subtext" id="overlaySubtext"></div>

        <button class="overlay-retry-btn" id="overlayRetryBtn">
            Tekrar Dene
        </button>

    </div>

    <!-- Video -->
    <video
        id="videoElement"
        playsinline
        webkit-playsinline
        preload="auto">
    </video>

    <!-- Kontroller -->
    <div class="controls-container" id="controlsContainer">

        <div class="progress-container" id="progressContainer">

            <div class="time-tooltip" id="timeTooltip">
                00:00
            </div>

            <div class="buffer-bar" id="bufferBar"></div>

            <div class="progress-bar" id="progressBar"></div>

        </div>

        <div class="controls-row">

            <div class="controls-left">

                <!-- Play -->
                <button
                    id="playPauseBtn"
                    class="custom-svg-btn"
                    title="Oynat/Duraklat (K)">

                    <svg id="playPauseIconSvg" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>

                </button>

                <!-- Ses -->
                <div class="volume-wrapper">

                    <button
                        id="muteBtn"
                        class="custom-svg-btn"
                        title="Sesi Aç/Kapat (M)">

                        <svg id="volumeIconSvg" viewBox="0 0 24 24">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77-2.99-7.86-7-8.77-7-8.77z"/>
                        </svg>

                    </button>

                    <input
                        type="range"
                        id="volumeSlider"
                        min="0"
                        max="1"
                        step="0.05"
                        value="1">

                </div>

                <!-- Süre -->
                <div class="time-text" id="timeDisplay">
                    00:00:00
                </div>

                <div class="live-badge" id="liveBadge">
                    CANLI
                </div>

            </div>

            <div class="controls-right">

                <!-- Altyazı -->
                <div class="menu-container">

                    <button
                        id="subtitlesBtn"
                        class="custom-svg-btn"
                        title="Altyazılar">

                        <svg viewBox="0 0 24 24">
                            <path d="M19 4H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H7v1h4v2H7v1h4v1H6V9h5v2zm7 5h-5v-1h4v-1h-3v-1h3v-1h-4V9h5v7z"/>
                        </svg>

                    </button>

                    <div
                        class="dropdown-panel"
                        id="subtitlesDropdown"
                        style="flex-direction:column;">

                        <div class="dropdown-header">
                            Altyazı
                        </div>

                        <div
                            id="subtitlesListContainer"
                            style="display:flex; flex-direction:column;">
                        </div>

                    </div>

                </div>

                <!-- Ayarlar -->
                <div class="menu-container">

                    <button
                        id="settingsBtn"
                        class="icon-btn"
                        title="Ayarlar">
                        ⚙️
                    </button>

                    <div
                        class="dropdown-panel"
                        id="settingsDropdown">

                        <!-- Kalite -->
                        <div class="menu-column">

                            <div class="dropdown-header">
                                Kalite
                            </div>

                            <div id="qualityListContainer"></div>

                        </div>

                        <!-- Hız -->
                        <div class="menu-column">

                            <div class="dropdown-header">
                                Hız
                            </div>

                            <div id="speedListContainer">

                                <button
                                    class="menu-option"
                                    onclick="setSpeed(0.5)">
                                    0.5x
                                </button>

                                <button
                                    class="menu-option selected"
                                    onclick="setSpeed(1)">
                                    Normal (1x)
                                </button>

                                <button
                                    class="menu-option"
                                    onclick="setSpeed(1.25)">
                                    1.25x
                                </button>

                                <button
                                    class="menu-option"
                                    onclick="setSpeed(1.5)">
                                    1.5x
                                </button>

                                <button
                                    class="menu-option"
                                    onclick="setSpeed(2)">
                                    2.0x
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- PiP -->
                <button
                    id="pipBtn"
                    class="custom-svg-btn"
                    title="Resim İçinde Resim">

                    <svg viewBox="0 0 24 24">
                        <path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-0.9 2-2V5c0-1.1-.9-2-2-2zm0 16.01H3V4.99h18v14.02z"/>
                    </svg>

                </button>

                <!-- Fullscreen -->
                <button
                    id="fullscreenBtn"
                    class="icon-btn"
                    title="Tam Ekran (F)">
                    ⛶
                </button>

            </div>

        </div>

    </div>

</div>


<script>

    /* =========================================================
       DOM
