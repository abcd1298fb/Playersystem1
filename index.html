<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FutbolLive — Canlı Skor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#05080d;
    --panel:#0b1119;
    --panel2:#101923;
    --panel3:#141e2a;
    --blue:#1688ff;
    --blue2:#4bb2ff;
    --green:#24d47b;
    --red:#ff4d5e;
    --yellow:#ffc83d;
    --white:#f5f8fc;
    --text:#d6dee8;
    --muted:#718094;
    --line:rgba(255,255,255,.07);
    --radius:16px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -20%,rgba(22,136,255,.16),transparent 35%),
        var(--bg);
    color:var(--text);
    font-family:Manrope,Arial,sans-serif;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.header{
    height:68px;
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    align-items:center;
    border-bottom:1px solid var(--line);
    background:rgba(5,8,13,.92);
    backdrop-filter:blur(18px);
}

.header-inner{
    width:min(1450px,calc(100% - 32px));
    margin:auto;
    display:flex;
    align-items:center;
    gap:28px;
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--white);
    text-decoration:none;
    font-family:"Barlow Condensed",sans-serif;
    font-size:31px;
    font-weight:800;
    letter-spacing:-.5px;
}

.logo-ball{
    width:31px;
    height:31px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(145deg,var(--blue2),var(--blue));
    color:#fff;
    font-size:16px;
    box-shadow:0 0 25px rgba(22,136,255,.35);
}

.nav{
    display:flex;
    align-items:center;
    gap:6px;
}

.nav button{
    background:transparent;
    color:var(--muted);
    padding:9px 12px;
    border-radius:9px;
    font-weight:700;
    font-size:13px;
}

.nav button.active,
.nav button:hover{
    background:rgba(255,255,255,.06);
    color:var(--white);
}

.search{
    margin-left:auto;
    position:relative;
    width:270px;
}

.search input{
    width:100%;
    height:40px;
    border:1px solid var(--line);
    border-radius:11px;
    outline:none;
    background:var(--panel);
    color:var(--white);
    padding:0 14px 0 40px;
}

.search input:focus{
    border-color:rgba(22,136,255,.55);
}

.search span{
    position:absolute;
    left:13px;
    top:10px;
    color:var(--muted);
}

.layout{
    width:min(1450px,calc(100% - 32px));
    margin:26px auto 60px;
    display:grid;
    grid-template-columns:230px minmax(0,1fr) 270px;
    gap:20px;
}

.sidebar,
.rightbar{
    min-width:0;
}

.side-box{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:15px;
}

.side-title{
    padding:15px 16px;
    border-bottom:1px solid var(--line);
    color:var(--white);
    font-weight:800;
    font-size:14px;
}

.side-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 15px;
    background:transparent;
    color:var(--muted);
    text-align:left;
    font-size:13px;
    font-weight:600;
}

.side-item:hover,
.side-item.active{
    background:rgba(22,136,255,.08);
    color:var(--white);
}

.side-icon{
    width:28px;
    height:28px;
    border-radius:8px;
    display:grid;
    place-items:center;
    background:var(--panel3);
}

.main{
    min-width:0;
}

.hero{
    background:
        linear-gradient(135deg,rgba(22,136,255,.15),transparent 55%),
        var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:24px;
    margin-bottom:20px;
}

.hero-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.hero h1{
    color:var(--white);
    font-family:"Barlow Condensed",sans-serif;
    font-size:36px;
    text-transform:uppercase;
    letter-spacing:.2px;
}

.hero p{
    color:var(--muted);
    margin-top:3px;
    font-size:13px;
}

.live-pill{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    border-radius:99px;
    background:rgba(36,212,123,.09);
    color:var(--green);
    font-size:11px;
    font-weight:800;
}

.live-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 12px var(--green);
}

.date-bar{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:20px;
    scrollbar-width:none;
}

.date-bar::-webkit-scrollbar{
    display:none;
}

.date-btn{
    flex:0 0 auto;
    min-width:90px;
    padding:11px 14px;
    border:1px solid var(--line);
    border-radius:11px;
    background:var(--panel);
    color:var(--muted);
    font-size:12px;
    font-weight:800;
}

.date-btn.active{
    color:#fff;
    background:var(--blue);
    border-color:var(--blue);
    box-shadow:0 8px 25px rgba(22,136,255,.22);
}

.league{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:15px;
}

.league-header{
    height:48px;
    padding:0 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.015);
}

.league-name{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--white);
    font-size:13px;
    font-weight:800;
}

.league-country{
    color:var(--muted);
    font-size:11px;
}

.match{
    min-height:78px;
    display:grid;
    grid-template-columns:65px minmax(0,1fr) 75px;
    align-items:center;
    padding:9px 15px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:.18s;
}

.match:last-child{
    border-bottom:0;
}

.match:hover{
    background:rgba(255,255,255,.025);
}

.match-time{
    color:var(--muted);
    font-size:11px;
    font-weight:800;
}

.match-time.live{
    color:var(--green);
}

.teams{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.team{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--text);
    font-size:13px;
    font-weight:700;
}

.team-logo{
    width:25px;
    height:25px;
    display:grid;
    place-items:center;
    border-radius:7px;
    background:var(--panel3);
    color:var(--muted);
    font-size:9px;
    font-weight:900;
    overflow:hidden;
}

.team-logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.score{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
    color:var(--white);
    font-weight:900;
    font-size:14px;
}

.score-live{
    color:var(--green);
}

.status{
    font-size:9px;
    color:var(--muted);
    font-weight:800;
}

.right-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:15px;
}

.right-title{
    padding:15px;
    border-bottom:1px solid var(--line);
    color:var(--white);
    font-size:14px;
    font-weight:800;
}

.popular{
    padding:13px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
}

.popular:last-child{
    border-bottom:0;
}

.popular span{
    color:var(--text);
    font-size:12px;
    font-weight:700;
}

.popular small{
    color:var(--muted);
    font-size:10px;
}

.empty{
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
}

.loading{
    padding:50px;
    text-align:center;
    color:var(--muted);
}

.error{
    padding:25px;
    border-radius:13px;
    background:rgba(255,77,94,.08);
    border:1px solid rgba(255,77,94,.15);
    color:#ff8792;
    font-size:13px;
}

@media(max-width:1050px){
    .layout{
        grid-template-columns:190px minmax(0,1fr);
    }

    .rightbar{
        display:none;
    }
}

@media(max-width:760px){
    .header{
        height:auto;
        padding:10px 0;
    }

    .header-inner{
        flex-wrap:wrap;
        gap:10px;
    }

    .logo{
        font-size:27px;
    }

    .nav{
        order:3;
        width:100%;
        overflow-x:auto;
        scrollbar-width:none;
    }

    .nav::-webkit-scrollbar{
        display:none;
    }

    .search{
        width:170px;
    }

    .layout{
        width:calc(100% - 20px);
        margin-top:15px;
        display:block;
    }

    .sidebar{
        display:none;
    }

    .hero{
        padding:18px;
    }

    .hero h1{
        font-size:30px;
    }

    .match{
        grid-template-columns:55px minmax(0,1fr) 55px;
        padding:9px 11px;
    }
}

@media(max-width:430px){
    .search{
        flex:1;
        width:auto;
    }

    .header-inner{
        width:calc(100% - 20px);
    }

    .match{
        min-height:74px;
    }

    .team{
        font-size:12px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">

        <a class="logo" href="#">
            <span class="logo-ball">⚽</span>
            FUTBOLLIVE
        </a>

        <nav class="nav">
            <button class="active">Maçlar</button>
            <button>Canlı</button>
            <button>Ligler</button>
            <button>Takımlar</button>
        </nav>

        <div class="search">
            <span>⌕</span>
            <input id="searchInput" type="text" placeholder="Takım veya maç ara...">
        </div>

    </div>
</header>

<div class="layout">

    <aside class="sidebar">

        <div class="side-box">
            <div class="side-title">Maçlar</div>

            <button class="side-item active">
                <span class="side-icon">⚽</span>
                Tüm Maçlar
            </button>

            <button class="side-item">
                <span class="side-icon">🔴</span>
                Canlı
            </button>

            <button class="side-item">
                <span class="side-icon">◷</span>
                Yaklaşan
            </button>

            <button class="side-item">
                <span class="side-icon">✓</span>
                Sonuçlanan
            </button>
        </div>

        <div class="side-box">
            <div class="side-title">Popüler Ligler</div>

            <button class="side-item">
                <span class="side-icon">🏴</span>
                Premier League
            </button>

            <button class="side-item">
                <span class="side-icon">🇹🇷</span>
                Süper Lig
            </button>

            <button class="side-item">
                <span class="side-icon">🇪🇸</span>
                La Liga
            </button>

            <button class="side-item">
                <span class="side-icon">🇮🇹</span>
                Serie A
            </button>

            <button class="side-item">
                <span class="side-icon">🇩🇪</span>
                Bundesliga
            </button>
        </div>

    </aside>

    <main class="main">

        <section class="hero">
            <div class="hero-top">

                <div>
                    <h1>Bugünün Maçları</h1>
                    <p id="todayText">Maçlar yükleniyor...</p>
                </div>

                <div class="live-pill">
                    <span class="live-dot"></span>
                    CANLI SKOR
                </div>

            </div>
        </section>

        <div class="date-bar">
            <button class="date-btn" data-date="prev">Dün</button>
            <button class="date-btn active" data-date="today">Bugün</button>
            <button class="date-btn" data-date="next">Yarın</button>
        </div>

        <div id="matches">
            <div class="loading">Maçlar yükleniyor...</div>
        </div>

    </main>

    <aside class="rightbar">

        <div class="right-card">

            <div class="right-title">
                🔴 Canlı Maçlar
            </div>

            <div id="liveMatches">
                <div class="empty">
                    Şu anda canlı maç bulunmuyor.
                </div>
            </div>

        </div>

        <div class="right-card">

            <div class="right-title">
                🏆 Popüler Ligler
            </div>

            <div class="popular">
                <span>Premier League</span>
                <small>İngiltere</small>
            </div>

            <div class="popular">
                <span>Süper Lig</span>
                <small>Türkiye</small>
            </div>

            <div class="popular">
                <span>La Liga</span>
                <small>İspanya</small>
            </div>

            <div class="popular">
                <span>Serie A</span>
                <small>İtalya</small>
            </div>

        </div>

    </aside>

</div>

<script>

let currentDate = getLocalDate();

function getLocalDate(offset = 0){

    const date = new Date();

    date.setDate(date.getDate() + offset);

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2,"0");
    const day = String(date.getDate()).padStart(2,"0");

    return `${year}-${month}-${day}`;
}

function formatDate(date){

    const parts = date.split("-");

    return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

function formatScore(score){

    if(
        score === null ||
        score === undefined
    ){
        return "-";
    }

    return score;
}

function teamHTML(team){

    const logo = team.logo
        ? `<img src="${team.logo}" alt="">`
        : team.short || "?";

    return `
        <div class="team">
            <div class="team-logo">${logo}</div>
            <span>${escapeHTML(team.name)}</span>
        </div>
    `;
}

function matchHTML(match){

    const isLive =
        match.status === "LIVE" ||
        match.status === "1H" ||
        match.status === "2H";

    let statusText = "";

    if(match.status === "NS"){
        statusText = "Başlamadı";
    }
    else if(match.status === "MS"){
        statusText = "MS";
    }
    else if(isLive){
        statusText = match.minute
            ? `${match.minute}'`
            : "CANLI";
    }
    else{
        statusText = match.status || "";
    }

    return `
        <div class="match" onclick="openMatch(${match.id})">

            <div class="match-time ${isLive ? "live" : ""}">
                ${match.time}
            </div>

            <div class="teams">
                ${teamHTML(match.home)}
                ${teamHTML(match.away)}
            </div>

            <div class="score">

                <span class="${isLive ? "score-live" : ""}">
                    ${formatScore(match.score.home)}
                </span>

                <span class="${isLive ? "score-live" : ""}">
                    ${formatScore(match.score.away)}
                </span>

                <span class="status">
                    ${statusText}
                </span>

            </div>

        </div>
    `;
}

function groupMatches(matches){

    const groups = {};

    matches.forEach(match => {

        if(!groups[match.league]){
            groups[match.league] = {
                country: match.country || "",
                matches: []
            };
        }

        groups[match.league].matches.push(match);

    });

    return groups;
}

function renderMatches(matches){

    const container =
        document.getElementById("matches");

    if(!matches.length){

        container.innerHTML = `
            <div class="league">
                <div class="empty">
                    Bu tarihte maç bulunamadı.
                </div>
            </div>
        `;

        return;
    }

    const groups = groupMatches(matches);

    let html = "";

    Object.entries(groups).forEach(([league,data]) => {

        html += `
            <section class="league">

                <div class="league-header">

                    <div class="league-name">
                        ⚽
                        ${escapeHTML(league)}
                    </div>

                    <span class="league-country">
                        ${escapeHTML(data.country)}
                    </span>

                </div>

                ${data.matches.map(matchHTML).join("")}

            </section>
        `;

    });

    container.innerHTML = html;
}

function renderLive(matches){

    const container =
        document.getElementById("liveMatches");

    const live = matches.filter(match =>
        ["LIVE","1H","2H"].includes(match.status)
    );

    if(!live.length){

        container.innerHTML = `
            <div class="empty">
                Şu anda canlı maç bulunmuyor.
            </div>
        `;

        return;
    }

    container.innerHTML = live.map(match => `

        <div class="popular"
             onclick="openMatch(${match.id})"
             style="cursor:pointer">

            <span>
                ${escapeHTML(match.home.name)}
                -
                ${escapeHTML(match.away.name)}
            </span>

            <small>
                ${match.score.home ?? 0} -
                ${match.score.away ?? 0}
            </small>

        </div>

    `).join("");
}

async function loadMatches(date = currentDate){

    const container =
        document.getElementById("matches");

    container.innerHTML =
        `<div class="loading">Maçlar yükleniyor...</div>`;

    try{

        const response =
            await fetch(`/api/matches?date=${date}`);

        if(!response.ok){
            throw new Error("API hatası");
        }

        const data =
            await response.json();

        if(!data.success){
            throw new Error("Veri alınamadı");
        }

        document.getElementById("todayText").textContent =
            `${formatDate(date)} · ${data.count} maç`;

        renderMatches(data.matches);
        renderLive(data.matches);

    }
    catch(error){

        container.innerHTML = `
            <div class="error">
                Maç verileri alınırken bir hata oluştu.
            </div>
        `;

        console.error(error);
    }
}

function openMatch(id){

    alert(
        "Maç detay sayfasını bir sonraki aşamada oluşturacağız.\n\nMaç ID: " + id
    );
}

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

/*
|--------------------------------------------------------------------------
| TARİH BUTONLARI
|--------------------------------------------------------------------------
*/

document.querySelectorAll(".date-btn")
.forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll(".date-btn")
            .forEach(btn =>
                btn.classList.remove("active")
            );

        button.classList.add("active");

        const type =
            button.dataset.date;

        if(type === "today"){
            currentDate = getLocalDate(0);
        }

        if(type === "prev"){
            currentDate = getLocalDate(-1);
        }

        if(type === "next"){
            currentDate = getLocalDate(1);
        }

        loadMatches(currentDate);

    });

});

/*
|--------------------------------------------------------------------------
| ARAMA
|--------------------------------------------------------------------------
*/

document
.getElementById("searchInput")
.addEventListener("input", async event => {

    const query =
        event.target.value
        .trim()
        .toLowerCase();

    if(!query){

        loadMatches(currentDate);
        return;
    }

    try{

        const response =
            await fetch(`/api/matches?date=${currentDate}`);

        const data =
            await response.json();

        const filtered =
            data.matches.filter(match =>

                match.home.name
                    .toLowerCase()
                    .includes(query)

                ||

                match.away.name
                    .toLowerCase()
                    .includes(query)

                ||

                match.league
                    .toLowerCase()
                    .includes(query)

            );

        renderMatches(filtered);

    }
    catch(error){

        console.error(error);

    }

});

/*
|--------------------------------------------------------------------------
| İLK YÜKLEME
|--------------------------------------------------------------------------
*/

loadMatches();

</script>

</body>
    </html>
