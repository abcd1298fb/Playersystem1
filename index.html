<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Tarzı Modern HLS Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #141414;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .player-wrapper {
            position: relative;
            width: 1000px;
            max-width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Yüklenme ve Hata Ekranı */
        .player-overlay {
            position: absolute;
            inset: 0;
            background: rgba(20, 20, 20, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        .player-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .netflix-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #E50914;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .overlay-text {
            margin-top: 15px;
            font-size: 15px;
            color: #b3b3b3;
            font-weight: 500;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Kontrol Paneli */
        .controls-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(20,20,20,0) 0%, rgba(20,20,20,0.75) 40%, rgba(20,20,20,0.95) 100%);
            padding: 25px 20px 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 20;
        }

        .player-wrapper.hide-controls .controls-container {
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
        }

        /* Gelişmiş Sürüklenebilir İlerleme Çubuğu */
        .progress-container {
            position: relative;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            cursor: pointer;
            transition: height 0.15s ease;
        }

        .progress-container:hover {
            height: 8px;
        }

        .buffer-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 2px;
            width: 0%;
            pointer-events: none;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #E50914;
            border-radius: 2px;
            width: 0%;
            pointer-events: none;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, color 0.15s;
        }

        button:hover {
            color: #E50914;
            transform: scale(1.1);
        }

        .time-text {
            font-size: 13px;
            color: #e5e5e5;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .live-badge {
            background: #E50914;
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 3px;
            letter-spacing: 1px;
        }

        /* Ses Bölümü ve SVG İkonlar */
        .volume-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .custom-svg-btn svg {
            width: 22px;
            height: 22px;
            fill: #fff;
            transition: fill 0.15s;
        }

        .custom-svg-btn:hover svg {
            fill: #E50914;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 70px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            accent-color: #E50914;
        }

        /* Netflix Menüleri (Kalite & Altyazı) */
        .menu-container {
            position: relative;
        }

        .dropdown-panel {
            position: absolute;
            bottom: 40px;
            right: 0;
            background: rgba(28, 28, 28, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            width: 170px;
            padding: 8px 0;
            display: none;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 30;
        }

        .dropdown-panel.active {
            display: flex;
        }

        .dropdown-header {
            font-size: 11px;
            color: #8c8c8c;
            padding: 6px 15px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 4px;
        }

        .menu-option {
            background: none;
            border: none;
            color: #d2d2d2;
            text-align: left;
            padding: 8px 15px;
            font-size: 13px;
            width: 100%;
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
        }

        .menu-option:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: none;
        }

        .menu-option.selected {
            color: #E50914;
            font-weight: 700;
        }

        .icon-btn {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="player-wrapper" id="playerWrapper">
        <div class="player-overlay active" id="playerOverlay">
            <div class="netflix-spinner"></div>
            <div class="overlay-text" id="overlayText">Yayın Yükleniyor...</div>
        </div>

        <video id="videoElement" playsinline></video>

        <div class="controls-container" id="controlsContainer">
            <!-- Sürüklenebilir İlerleme Çubuğu -->
            <div class="progress-container" id="progressContainer">
                <div class="buffer-bar" id="bufferBar"></div>
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="controls-row">
                <div class="controls-left">
                    <button id="playPauseBtn" class="icon-btn" title="Oynat/Duraklat">❚❚</button>
                    
                    <div class="volume-wrapper">
                        <button id="muteBtn" class="custom-svg-btn" title="Sesi Aç/Kapat">
                            <svg id="volumeIconSvg" viewBox="0 0 24 24">
                                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                            </svg>
                        </button>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                    </div>

                    <div class="time-text" id="timeDisplay">00:00:00</div>
                    <div class="live-badge" id="liveBadge">CANLI</div>
                </div>

                <div class="controls-right">
                    <!-- Altyazı Butonu ve Menüsü -->
                    <div class="menu-container">
                        <button id="subtitlesBtn" class="custom-svg-btn" title="Altyazılar">
                            <svg viewBox="0 0 24 24">
                                <path d="M19 4H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H7v1h4v2H7v1h4v1H6V9h5v2zm7 5h-5v-1h4v-1h-3v-1h3v-1h-4V9h5v7z"/>
                            </svg>
                        </button>
                        <div class="dropdown-panel" id="subtitlesDropdown">
                            <div class="dropdown-header">Altyazı</div>
                            <div id="subtitlesListContainer"></div>
                        </div>
                    </div>

                    <!-- Kalite / Ayarlar Butonu ve Menüsü -->
                    <div class="menu-container">
                        <button id="settingsBtn" class="icon-btn" title="Ayarlar">⚙️</button>
                        <div class="dropdown-panel" id="settingsDropdown">
                            <div class="dropdown-header">Kalite</div>
                            <div id="qualityListContainer"></div>
                        </div>
                    </div>

                    <button id="fullscreenBtn" class="icon-btn" title="Tam Ekran">⛶</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const playerWrapper = document.getElementById('playerWrapper');
        const playerOverlay = document.getElementById('playerOverlay');
        const overlayText = document.getElementById('overlayText');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volumeIconSvg = document.getElementById('volumeIconSvg');
        const volumeSlider = document.getElementById('volumeSlider');
        const timeDisplay = document.getElementById('timeDisplay');
        const liveBadge = document.getElementById('liveBadge');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const bufferBar = document.getElementById('bufferBar');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsDropdown = document.getElementById('settingsDropdown');
        const qualityListContainer = document.getElementById('qualityListContainer');
        const subtitlesBtn = document.getElementById('subtitlesBtn');
        const subtitlesDropdown = document.getElementById('subtitlesDropdown');
        const subtitlesListContainer = document.getElementById('subtitlesListContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        const streamUrl = 'https://Pz4qT7nW1mR9sH2vL5xK8jG3y.medya.trt.com.tr/master.m3u8';
        let hls = null;
        let hideTimeout = null;
        let isDragging = false;

        function initPlayer() {
            if (Hls.isSupported()) {
                hls = new Hls({ maxBufferLength: 30, liveSyncDurationCount: 3 });
                hls.loadSource(streamUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    hideOverlay();
                    buildQualityMenu(data.levels);
                    buildSubtitleMenu();
                    video.play().catch(() => playPauseBtn.textContent = '▶');
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => { 
                    hideOverlay(); 
                    buildSubtitleMenu();
                    video.play(); 
                });
            }
        }

        function hideOverlay() { playerOverlay.classList.remove('active'); }

        // Kalite Menüsü Oluşturma
        function buildQualityMenu(levels) {
            qualityListContainer.innerHTML = '';
            const autoBtn = document.createElement('button');
            autoBtn.className = 'menu-option selected';
            autoBtn.textContent = 'Otomatik';
            autoBtn.onclick = () => { hls.currentLevel = -1; updateSelectedUI(autoBtn, qualityListContainer); };
            qualityListContainer.appendChild(autoBtn);

            levels.forEach((level, index) => {
                const btn = document.createElement('button');
                btn.className = 'menu-option';
                btn.textContent = level.height ? `${level.height}p` : `Seviye ${index + 1}`;
                btn.onclick = () => { hls.currentLevel = index; updateSelectedUI(btn, qualityListContainer); };
                qualityListContainer.appendChild(btn);
            });
        }

        // Altyazı Menüsü Oluşturma
        function buildSubtitleMenu() {
            subtitlesListContainer.innerHTML = '';
            const offBtn = document.createElement('button');
            offBtn.className = 'menu-option selected';
            offBtn.textContent = 'Kapalı';
            offBtn.onclick = () => {
                for (let i = 0; i < video.textTracks.length; i++) {
                    video.textTracks[i].mode = 'hidden';
                }
                updateSelectedUI(offBtn, subtitlesListContainer);
            };
            subtitlesListContainer.appendChild(offBtn);

            if (video.textTracks && video.textTracks.length > 0) {
                for (let i = 0; i < video.textTracks.length; i++) {
                    const track = video.textTracks[i];
                    const btn = document.createElement('button');
                    btn.className = 'menu-option';
                    btn.textContent = track.label || `Altyazı ${i + 1}`;
                    btn.onclick = () => {
                        for (let j = 0; j < video.textTracks.length; j++) {
                            video.textTracks[j].mode = j === i ? 'showing' : 'hidden';
                        }
                        updateSelectedUI(btn, subtitlesListContainer);
                    };
                    subtitlesListContainer.appendChild(btn);
                }
            }
        }

        function updateSelectedUI(el, container) {
            container.querySelectorAll('.menu-option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            settingsDropdown.classList.remove('active');
            subtitlesDropdown.classList.remove('active');
        }

        // Menü Açma / Kapama Mantığı
        settingsBtn.addEventListener('click', (e) => { 
            e.stopPropagation(); 
            settingsDropdown.classList.toggle('active'); 
            subtitlesDropdown.classList.remove('active');
        });

        subtitlesBtn.addEventListener('click', (e) => { 
            e.stopPropagation(); 
            subtitlesDropdown.classList.toggle('active'); 
            settingsDropdown.classList.remove('active');
        });

        document.addEventListener('click', () => {
            settingsDropdown.classList.remove('active');
            subtitlesDropdown.classList.remove('active');
        });
        settingsDropdown.addEventListener('click', (e) => e.stopPropagation());
        subtitlesDropdown.addEventListener('click', (e) => e.stopPropagation());

        // Sadece alttaki butonla oynat/durdur (Ekrana tıklayınca durma engellendi)
        playPauseBtn.addEventListener('click', togglePlay);
        
        function togglePlay() {
            if (video.paused) { video.play(); playPauseBtn.textContent = '❚❚'; }
            else { video.pause(); playPauseBtn.textContent = '▶'; }
        }

        video.addEventListener('play', () => playPauseBtn.textContent = '❚❚');
        video.addEventListener('pause', () => playPauseBtn.textContent = '▶');

        // Süre Takibi
        video.addEventListener('timeupdate', () => {
            if (isDragging) return;
            const current = video.currentTime;
            const duration = video.duration;

            if (isFinite(duration) && duration > 0) {
                progressBar.style.width = `${(current / duration) * 100}%`;
                timeDisplay.textContent = formatTime(current);
                liveBadge.style.display = 'none';
            } else {
                timeDisplay.textContent = formatTime(current);
                liveBadge.style.display = 'inline-block';
            }

            if (video.buffered.length > 0) {
                const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                if (isFinite(duration) && duration > 0) {
                    bufferBar.style.width = `${(bufferedEnd / duration) * 100}%`;
                }
            }
        });

        // Üzerine Basılı Tutup Çekerek İlerleme (Scrubbing / Sürükleme Hissi)
        function getClampedPos(e) {
            const rect = progressContainer.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let pos = (clientX - rect.left) / rect.width;
            return Math.max(0, Math.min(1, pos));
        }

        progressContainer.addEventListener('mousedown', (e) => {
            isDragging = true;
            updateDragPosition(e);
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            updateDragPosition(e);
        });

        document.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            if (isFinite(video.duration) && video.duration > 0) {
                const pos = getClampedPos(e);
                video.currentTime = pos * video.duration;
            }
        });

        // Dokunmatik (Mobil) Sürükleme Desteği
        progressContainer.addEventListener('touchstart', (e) => {
            isDragging = true;
            updateDragPosition(e);
        });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            updateDragPosition(e);
        });

        document.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            if (isFinite(video.duration) && video.duration > 0 && e.changedTouches) {
                const pos = getClampedPos(e.changedTouches[0]);
                video.currentTime = pos * video.duration;
            }
        });

        function updateDragPosition(e) {
            const pos = getClampedPos(e);
            progressBar.style.width = `${pos * 100}%`;
            if (isFinite(video.duration) && video.duration > 0) {
                timeDisplay.textContent = formatTime(pos * video.duration);
            }
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) {
                return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            }
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Ses Kontrolleri
        volumeSlider.addEventListener('input', (e) => {
            video.volume = e.target.value;
            video.muted = e.target.value == 0;
            updateVolumeIcon();
        });

        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            volumeSlider.value = video.muted ? 0 : video.volume;
            updateVolumeIcon();
        });

        function updateVolumeIcon() {
            if (video.muted || video.volume == 0) {
                volumeIconSvg.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C22.63 14.85 23 13.47 23 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
            } else {
                volumeIconSvg.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
            }
        }

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) playerWrapper.requestFullscreen().catch(err => console.error(err));
            else document.exitFullscreen();
        });

        playerWrapper.addEventListener('mousemove', () => {
            playerWrapper.classList.remove('hide-controls');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                if (!video.paused && !settingsDropdown.classList.contains('active') && !subtitlesDropdown.classList.contains('active')) {
                    playerWrapper.classList.add('hide-controls');
                }
            }, 3000);
        });

        initPlayer();
    </script>
</body>
</html>
