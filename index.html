<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Tarzı Özel HLS Player</title>
    <!-- HLS.js Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Netflix Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #141414;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .player-wrapper {
            position: relative;
            width: 1000px;
            max-width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            cursor: pointer;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Yüklenme ve Hata Ekranı */
        .player-overlay {
            position: absolute;
            inset: 0;
            background: rgba(20, 20, 20, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        .player-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .netflix-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #E50914; /* Netflix Kırmızısı */
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .overlay-text {
            margin-top: 15px;
            font-size: 15px;
            color: #b3b3b3;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Netflix Kontrol Paneli (Gradient Perde) */
        .controls-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(20,20,20,0) 0%, rgba(20,20,20,0.75) 40%, rgba(20,20,20,0.95) 100%);
            padding: 30px 25px 20px 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 20;
        }

        .player-wrapper.hide-controls .controls-container {
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
        }

        /* İlerleme ve Buffer Çubuğu (Netflix Kırmızı Tema) */
        .progress-container {
            position: relative;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            cursor: pointer;
            overflow: visible;
            transition: height 0.15s ease;
        }

        .progress-container:hover {
            height: 8px;
        }

        .buffer-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 2px;
            width: 0%;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #E50914;
            border-radius: 2px;
            width: 0%;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 12px;
            height: 12px;
            background: #E50914;
            border-radius: 50%;
            transition: transform 0.1s ease;
        }

        .progress-container:hover .progress-bar::after {
            transform: translateY(-50%) scale(1);
        }

        /* Alt Buton Sırası */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, color 0.15s;
        }

        button:hover {
            color: #E50914;
            transform: scale(1.08);
        }

        .time-text {
            font-size: 13px;
            color: #e5e5e5;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .live-badge {
            background: #E50914;
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 3px;
            letter-spacing: 1px;
        }

        /* Ses Bölümü */
        .volume-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 75px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            accent-color: #E50914;
        }

        /* --- NETFLIX TARZI KALİTE / AYARLAR POPUP MENÜSÜ --- */
        .settings-menu-container {
            position: relative;
        }

        .settings-dropdown {
            position: absolute;
            bottom: 45px;
            right: 0;
            background: rgba(28, 28, 28, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            width: 180px;
            padding: 8px 0;
            display: none;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 30;
        }

        .settings-dropdown.active {
            display: flex;
        }

        .settings-header {
            font-size: 12px;
            color: #8c8c8c;
            padding: 6px 15px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 4px;
        }

        .quality-option {
            background: none;
            border: none;
            color: #d2d2d2;
            text-align: left;
            padding: 8px 15px;
            font-size: 13px;
            width: 100%;
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
        }

        .quality-option:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: none;
        }

        .quality-option.selected {
            color: #E50914;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="player-wrapper" id="playerWrapper">
        <!-- Netflix Tarzı Yükleniyor Katmanı -->
        <div class="player-overlay active" id="playerOverlay">
            <div class="netflix-spinner"></div>
            <div class="overlay-text" id="overlayText">TRT Yayını Yükleniyor...</div>
        </div>

        <video id="videoElement" playsinline></video>

        <!-- Kontrol Çubuğu -->
        <div class="controls-container" id="controlsContainer">
            <!-- İlerleme Çubuğu -->
            <div class="progress-container" id="progressContainer">
                <div class="buffer-bar" id="bufferBar"></div>
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="controls-row">
                <div class="controls-left">
                    <button id="playPauseBtn" title="Oynat / Duraklat">❚❚</button>
                    
                    <div class="volume-wrapper">
                        <button id="muteBtn" title="Sesi Aç/Kapat">🔊</button>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                    </div>

                    <div class="time-text" id="timeDisplay">00:00</div>
                    <div class="live-badge" id="liveBadge">CANLI</div>
                </div>

                <div class="controls-right">
                    <!-- Netflix Ayarlar / Kalite Butonu -->
                    <div class="settings-menu-container">
                        <button id="settingsBtn" title="Kalite / Ayarlar">⚙️</button>
                        
                        <div class="settings-dropdown" id="settingsDropdown">
                            <div class="settings-header">Görüntü Kalitesi</div>
                            <div id="qualityListContainer">
                                <!-- Dinamik kalite seçenekleri buraya dolacak -->
                            </div>
                        </div>
                    </div>

                    <button id="fullscreenBtn" title="Tam Ekran">⛶</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const playerWrapper = document.getElementById('playerWrapper');
        const playerOverlay = document.getElementById('playerOverlay');
        const overlayText = document.getElementById('overlayText');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const timeDisplay = document.getElementById('timeDisplay');
        const liveBadge = document.getElementById('liveBadge');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const bufferBar = document.getElementById('bufferBar');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsDropdown = document.getElementById('settingsDropdown');
        const qualityListContainer = document.getElementById('qualityListContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // TRT Master M3U8 Linki
        const streamUrl = 'https://Pz4qT7nW1mR9sH2vL5xK8jG3y.medya.trt.com.tr/master.m3u8';
        let hls = null;
        let hideTimeout = null;

        // --- HLS.JS & TRT BAĞLANTISI ---
        function initPlayer() {
            if (Hls.isSupported()) {
                hls = new Hls({
                    maxBufferLength: 30,
                    liveSyncDurationCount: 3,
                });

                hls.loadSource(streamUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    hideOverlay();
                    buildQualityMenu(data.levels);
                    video.play().catch(() => {
                        // Tarayıcı autoplay engellerse sessize alıp tekrar deneyebiliriz veya kullanıcı tıklamasını bekleriz
                        playPauseBtn.textContent = '▶';
                    });
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                overlayText.textContent = 'Yayın ağına bağlanılıyor...';
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                overlayText.textContent = 'Medya akışı düzeltiliyor...';
                                hls.recoverMediaError();
                                break;
                            default:
                                overlayText.textContent = 'Yayın kaynağına ulaşılamadı (CORS/Link Hatası).';
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => {
                    hideOverlay();
                    video.play();
                });
            } else {
                overlayText.textContent = 'Tarayıcınız bu video formatını desteklemiyor.';
            }
        }

        function hideOverlay() {
            playerOverlay.classList.remove('active');
        }

        // --- NETFLIX KALİTE MENÜSÜ ---
        function buildQualityMenu(levels) {
            qualityListContainer.innerHTML = '';
            
            // Otomatik Seçenek
            const autoBtn = document.createElement('button');
            autoBtn.className = 'quality-option selected';
            autoBtn.textContent = 'Otomatik';
            autoBtn.onclick = () => {
                hls.currentLevel = -1; // Auto
                updateSelectedQualityUI(autoBtn);
            };
            qualityListContainer.appendChild(autoBtn);

            // Manuel Kaliteler (Yüksekten düşüğe)
            levels.forEach((level, index) => {
                const btn = document.createElement('button');
                btn.className = 'quality-option';
                btn.textContent = level.height ? `${level.height}p` : `Seviye ${index + 1}`;
                btn.onclick = () => {
                    hls.currentLevel = index;
                    updateSelectedQualityUI(btn);
                };
                qualityListContainer.appendChild(btn);
            });
        }

        function updateSelectedQualityUI(selectedElement) {
            document.querySelectorAll('.quality-option').forEach(el => el.classList.remove('selected'));
            selectedElement.classList.add('selected');
            settingsDropdown.classList.remove('active');
        }

        // Ayarlar menüsünü aç/kapat
        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsDropdown.classList.toggle('active');
        });

        // Menü dışına tıklanınca kapat
        document.addEventListener('click', () => {
            settingsDropdown.classList.remove('active');
        });
        settingsDropdown.addEventListener('click', (e) => e.stopPropagation());

        // --- OYNATICI KONTROLLERİ ---
        playPauseBtn.addEventListener('click', togglePlay);
        video.addEventListener('click', togglePlay);

        function togglePlay() {
            if (video.paused) {
                video.play();
                playPauseBtn.textContent = '❚❚';
            } else {
                video.pause();
                playPauseBtn.textContent = '▶';
            }
        }

        video.addEventListener('play', () => playPauseBtn.textContent = '❚❚');
        video.addEventListener('pause', () => playPauseBtn.textContent = '▶');

        // Süre ve Progress Takibi
        video.addEventListener('timeupdate', () => {
            const current = video.currentTime;
            const duration = video.duration;

            if (isFinite(duration) && duration > 0) {
                const percent = (current / duration) * 100;
                progressBar.style.width = `${percent}%`;
                timeDisplay.textContent = formatTime(current);
                liveBadge.style.display = 'none';
            } else {
                timeDisplay.textContent = formatTime(current);
                liveBadge.style.display = 'inline-block';
            }

            if (video.buffered.length > 0) {
                const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                if (isFinite(duration) && duration > 0) {
                    bufferBar.style.width = `${(bufferedEnd / duration) * 100}%`;
                }
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            if (isFinite(video.duration)) {
                video.currentTime = pos * video.duration;
            }
        });

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Ses Kontrolleri
        volumeSlider.addEventListener('input', (e) => {
            video.volume = e.target.value;
            video.muted = e.target.value == 0;
            updateVolumeIcon();
        });

        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            volumeSlider.value = video.muted ? 0 : video.volume;
            updateVolumeIcon();
        });

        function updateVolumeIcon() {
            if (video.muted || video.volume == 0) {
                muteBtn.textContent = '🔇';
            } else {
                muteBtn.textContent = '🔊';
            }
        }

        // Tam Ekran
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                playerWrapper.requestFullscreen().catch(err => console.error(err));
            } else {
                document.exitFullscreen();
            }
        });

        // Mouse Hareketsiz Kalınca Kontrolleri Gizle (Netflix Tarzı)
        playerWrapper.addEventListener('mousemove', () => {
            playerWrapper.classList.remove('hide-controls');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                if (!video.paused && !settingsDropdown.classList.contains('active')) {
                    playerWrapper.classList.add('hide-controls');
                }
            }, 3000);
        });

        // Başlat
        initPlayer();
    </script>
</body>
</html>
